name: Odds collector — Selenium pilot

on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *' # UTC; around 17 minutes before the hourly ChatGPT cycle

permissions:
  contents: write

concurrency:
  group: bkliz-odds-collector-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Selenium
        run: python -m pip install 'selenium>=4.20,<5'

      - name: Run deterministic collector tests
        run: python -m unittest discover -s tests -p 'test_odds_collector.py' -v

      - name: Probe approved bookmaker event
        id: probe
        continue-on-error: true
        run: python scripts/odds_collector.py

      - name: Upload diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/odds/latest.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate and persist status JSON only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f data/odds/latest.json || { echo "No pilot JSON generated"; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open("data/odds/latest.json", encoding="utf-8"))
          assert d["schema_version"] == 1
          assert d["collector"] == "BKliz Selenium pilot"
          assert all(x["odds"] is None and not x["price_verified"] for x in d["observations"])
          print("JSON validated; confirmed prices: 0")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Write the expiry state once; do not endlessly commit an expired test fixture.
          python - <<'PY'
          import json, pathlib, subprocess
          new = json.loads(pathlib.Path("data/odds/latest.json").read_text(encoding="utf-8"))
          if new["status"] == "all_expired":
              old = json.loads(subprocess.check_output(
                  ["git", "show", "HEAD:data/odds/latest.json"], text=True))
              if old.get("status") == "all_expired":
                  pathlib.Path(".odds-skip-commit").touch()
          PY
          if [ -f .odds-skip-commit ]; then
            echo 'No active targets: previously recorded expiry, skipping commit'
            exit 0
          fi
          git add data/odds/latest.json
          if git diff --cached --quiet; then
            echo 'No JSON changes'
            exit 0
          fi
          git commit -m 'Record hourly Selenium odds pilot status'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Mark inaccessible bookmaker source as failed
        if: steps.probe.outcome == 'failure'
        run: |
          echo 'Selenium could not render the bookmaker source; see status JSON artifact.'
          exit 1
